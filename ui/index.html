<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Playlist</title>
<style>
  :root {
    --fg: #1d1d1f;
    --fg-secondary: rgba(0,0,0,0.5);
    --fg-tertiary: rgba(0,0,0,0.35);
    --sep: rgba(0,0,0,0.08);
    --row-hover: rgba(0,0,0,0.05);
    --row-sel: rgba(0,122,255,0.16);
    --accent: #007aff;
    --toolbar-bg: rgba(255,255,255,0.55);
    --field-bg: rgba(0,0,0,0.06);
    --menu-bg: rgba(250,250,250,0.98);
    --menu-shadow: rgba(0,0,0,0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --fg-secondary: rgba(255,255,255,0.55);
      --fg-tertiary: rgba(255,255,255,0.35);
      --sep: rgba(255,255,255,0.09);
      --row-hover: rgba(255,255,255,0.06);
      --row-sel: rgba(10,132,255,0.28);
      --accent: #0a84ff;
      --toolbar-bg: rgba(40,40,42,0.55);
      --field-bg: rgba(255,255,255,0.10);
      --menu-bg: rgba(50,50,52,0.98);
      --menu-shadow: rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--fg);
  }
  body { display: flex; flex-direction: column; }

  /* Toolbar */
  .toolbar {
    flex: 0 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 8px;
    background: var(--toolbar-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--sep); position: relative; z-index: 5;
  }
  .toolbar-row { display: flex; gap: 6px; align-items: center; }
  .search {
    flex: 1 1 auto; display: flex; align-items: center; gap: 6px;
    background: var(--field-bg); border-radius: 7px; padding: 4px 8px;
  }
  .search svg { flex: 0 0 auto; opacity: 0.5; }
  .search input {
    flex: 1 1 auto; border: 0; background: transparent; outline: none;
    color: var(--fg); font-size: 13px;
  }
  select.sort {
    -webkit-appearance: none; appearance: none; border: 0; border-radius: 7px;
    background: var(--field-bg); color: var(--fg); padding: 5px 22px 5px 8px; font-size: 12px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' viewBox='0 0 8 8'><path d='M0 2l4 4 4-4' fill='none' stroke='gray' stroke-width='1.3'/></svg>");
    background-repeat: no-repeat; background-position: right 7px center;
    cursor: pointer;
  }
  .btn {
    border: 0; border-radius: 7px; background: var(--field-bg); color: var(--fg);
    padding: 5px 9px; font-size: 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn:hover { background: rgba(128,128,128,0.22); }
  .btn:active { transform: translateY(0.5px); }
  .btn.icon { padding: 5px 7px; }
  .btn.active { background: var(--accent); color: #fff; }
  .btn.active:hover { background: var(--accent); opacity: 0.9; }
  .btn.dir { min-width: 26px; justify-content: center; }
  .spacer { flex: 1 1 auto; }

  /* Saved playlists dropdown */
  .dropdown { position: relative; }
  .menu {
    position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 200px;
    background: var(--menu-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--sep); border-radius: 9px; padding: 5px;
    box-shadow: 0 8px 26px var(--menu-shadow); z-index: 50; display: none;
    max-height: 320px; overflow-y: auto;
  }
  .menu.open { display: block; }
  .menu .mi {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px;
  }
  .menu .mi:hover { background: var(--accent); color: #fff; }
  .menu .mi .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .mi .del { opacity: 0.55; padding: 0 3px; border-radius: 4px; }
  .menu .mi .del:hover { background: rgba(255,255,255,0.25); opacity: 1; }
  .menu .sep { height: 1px; background: var(--sep); margin: 5px 4px; }
  .menu .empty { padding: 8px; color: var(--fg-secondary); font-size: 12px; text-align: center; }

  /* List */
  .list-wrap { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
  .list { padding: 4px 0; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px;
    border-bottom: 1px solid var(--sep); cursor: default; position: relative;
  }
  .row:hover { background: var(--row-hover); }
  .row.selected { background: var(--row-sel); }
  /* .row.cursor carries no styling on purpose: the keyboard cursor row is always
     selected too, so the selection background alone marks it. The class stays as a
     DOM hook for scrolling the cursor row into view. */
  .row.playing .title { color: var(--accent); font-weight: 600; }
  .row.dragover-top { box-shadow: inset 0 2px 0 var(--accent); }
  .row.dragover-bottom { box-shadow: inset 0 -2px 0 var(--accent); }

  .status { flex: 0 0 16px; width: 16px; text-align: center; color: var(--accent); font-size: 11px; }
  .idx { flex: 0 0 auto; min-width: 18px; text-align: right; color: var(--fg-tertiary);
         font-variant-numeric: tabular-nums; font-size: 11px; }
  .meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .title { font-size: 13px; font-weight: 500; display: block; max-width: 100%;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 11px; color: var(--fg-secondary); display: block; max-width: 100%;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 1px; }
  .dur { flex: 0 0 auto; color: var(--fg-secondary); font-variant-numeric: tabular-nums;
         font-size: 11px; padding-left: 6px; white-space: nowrap; }

  /* Progress bar */
  .progress-row { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 7px 14px 0; background: var(--toolbar-bg); }
  .ptime { font-size: 10px; color: var(--fg-secondary); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
  .pbar { position: relative; flex: 1 1 auto; height: 5px; border-radius: 3px; background: var(--field-bg); cursor: pointer; }
  .pfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.5s linear; }
  .pbar.scrubbing .pfill { transition: none; }
  .pfill::after {
    content: ""; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 2px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.15s;
  }
  .pbar:hover .pfill::after, .pbar.scrubbing .pfill::after { opacity: 1; }

  /* Transport controls */
  .transport {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px; gap: 8px; border-top: 1px solid var(--sep); background: var(--toolbar-bg);
    backdrop-filter: blur(20px);
  }
  .tgroup { display: flex; align-items: center; gap: 12px; }
  .tbtn {
    border: 0; background: transparent; color: var(--fg); cursor: pointer;
    font-size: 18px; line-height: 1; padding: 3px 5px; border-radius: 6px; opacity: 0.85;
    -webkit-user-select: none; user-select: none;
  }
  .tbtn:hover { opacity: 1; background: var(--row-hover); }
  .tbtn:active { transform: translateY(0.5px); }
  .tbtn.play { font-size: 23px; }
  .tbtn.side { font-size: 15px; opacity: 0.45; }
  .tbtn.side.active { opacity: 1; color: var(--accent); }
  .tgroup.modes, .tgroup.vol { gap: 6px; }
  .tgroup.vol { min-width: 108px; justify-content: flex-end; }
  .volslider {
    -webkit-appearance: none; appearance: none; width: 78px; height: 4px; border-radius: 2px;
    background: var(--field-bg); cursor: pointer; outline: none;
  }
  .volslider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 2px rgba(0,0,0,0.35);
  }

  /* Empty & footer */
  .empty-state { color: var(--fg-secondary); text-align: center; padding: 40px 20px; font-size: 13px; }
  .footer {
    flex: 0 0 auto; padding: 5px 10px; font-size: 11px; color: var(--fg-secondary);
    border-top: 1px solid var(--sep); display: flex; align-items: center; gap: 8px;
    background: var(--toolbar-bg);
  }
  .footer .scan { display: none; align-items: center; gap: 5px; }
  .footer .scan.on { display: inline-flex; }
  .footer .autosave {
    display: none; align-items: center; gap: 4px; color: var(--accent);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .footer .autosave.on { display: inline-flex; }
  .spin {
    width: 10px; height: 10px; border: 1.5px solid var(--fg-tertiary);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Save dialog */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
    display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.28);
  }
  .overlay.open { display: flex; }
  .dialog {
    width: 300px; max-width: 86%; padding: 14px; display: flex; flex-direction: column; gap: 9px;
    background: var(--menu-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--sep); border-radius: 11px; box-shadow: 0 10px 34px var(--menu-shadow);
  }
  .dialog .dlg-title { font-size: 13px; font-weight: 600; }
  .dialog input {
    border: 1px solid var(--sep); border-radius: 7px; background: var(--field-bg); color: var(--fg);
    padding: 6px 9px; font-size: 13px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  .dialog input:focus { border-color: var(--accent); }
  .dialog .dlg-hint { font-size: 11px; color: var(--fg-secondary); min-height: 14px; }
  .dialog .dlg-buttons { display: flex; justify-content: flex-end; gap: 7px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent); opacity: 0.9; }
  .btn[disabled] { opacity: 0.45; pointer-events: none; }

  /* YouTube Music search panel — takes the place of the toolbar and the list while open */
  body.ytm-open .toolbar, body.ytm-open .list-wrap { display: none; }
  .ytm-panel { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
  body.ytm-open .ytm-panel { display: flex; }
  .ytm-head {
    flex: 0 0 auto; padding: 8px; display: flex; gap: 6px; align-items: center;
    background: var(--toolbar-bg); border-bottom: 1px solid var(--sep);
  }
  .ytm-status {
    flex: 0 0 auto; padding: 5px 10px; font-size: 11px; color: var(--fg-secondary);
    display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--sep);
  }
  .ytm-results { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
  .ytm-row.cursor { background: var(--row-sel); }
  .ytm-thumb {
    flex: 0 0 36px; width: 36px; height: 36px; border-radius: 4px;
    background: var(--field-bg); object-fit: cover;
  }
  .ytm-actions { flex: 0 0 auto; display: flex; gap: 4px; }
  .ytm-actions .btn { padding: 3px 7px; }
  .ytm-actions .btn.added { color: var(--accent); }

  /* Context menu */
  #ctx {
    position: fixed; background: var(--menu-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--sep); border-radius: 9px; padding: 5px; min-width: 170px;
    box-shadow: 0 8px 26px var(--menu-shadow); z-index: 100; display: none;
  }
  #ctx .mi { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #ctx .mi:hover { background: var(--accent); color: #fff; }
  #ctx .sep { height: 1px; background: var(--sep); margin: 5px 4px; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16"><path d="M11 11l3 3M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <input id="search" type="search" placeholder="Search title, artist, album…" autocomplete="off">
      </div>
      <select id="sort" class="sort" title="Sort by">
        <option value="order">Playlist order</option>
        <option value="title">Title</option>
        <option value="artist">Artist</option>
        <option value="album">Album</option>
        <option value="duration">Duration</option>
      </select>
      <button id="sortdir" class="btn dir" title="Toggle sort direction">↑</button>
    </div>
    <div class="toolbar-row">
      <button id="add" class="btn" title="Add a media file">＋ Add</button>
      <button id="addfolder" class="btn icon" title="Add a folder (all media inside, incl. subfolders)">📁</button>
      <button id="addurl" class="btn icon" title="Add a URL (single video or a playlist)">🔗</button>
      <button id="ytmOpen" class="btn icon" title="Search YouTube Music and add songs">🎵</button>
      <div class="dropdown">
        <button id="loadBtn" class="btn" title="Load a saved playlist">▾ Load</button>
        <div id="loadMenu" class="menu"></div>
      </div>
      <button id="save" class="btn" title="Save the playlist — keep the name to update it, change it to save a copy">Save</button>
      <div class="spacer"></div>
      <button id="locate" class="btn icon" title="Scroll to the current track">🎯</button>
      <button id="hidemain" class="btn icon" title="Hide the player window (show only the playlist)" style="display:none">🖥</button>
      <button id="popout" class="btn icon" title="Open in a resizable window">⤢</button>
      <button id="refresh" class="btn icon" title="Refresh">⟳</button>
      <button id="clear" class="btn icon" title="Clear playlist">🗑</button>
    </div>
  </div>

  <div class="list-wrap" id="listWrap">
    <div class="list" id="list"></div>
    <div class="empty-state" id="emptyState" style="display:none">No items in the playlist.<br>Play something or press “＋ Add”.</div>
  </div>

  <div class="ytm-panel" id="ytmPanel">
    <div class="ytm-head">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16"><path d="M11 11l3 3M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <input id="ytmQuery" type="search" placeholder="Search YouTube Music…" autocomplete="off" spellcheck="false">
      </div>
      <button id="ytmAddAll" class="btn" title="Add all results to the end of the playlist" disabled>＋ All</button>
      <button id="ytmClose" class="btn icon" title="Back to the playlist (Esc)">✕</button>
    </div>
    <div class="ytm-status" id="ytmStatus"></div>
    <div class="ytm-results" id="ytmResults"></div>
  </div>

  <div class="progress-row">
    <span class="ptime" id="pCur">0:00</span>
    <div class="pbar" id="pbar"><div class="pfill" id="pfill"></div></div>
    <span class="ptime" id="pDur">0:00</span>
  </div>

  <div class="transport">
    <div class="tgroup modes">
      <button id="tShuffle" class="tbtn side" title="Shuffle">🔀</button>
      <button id="tRepeat" class="tbtn side" title="Repeat: off">🔁</button>
    </div>
    <div class="tgroup">
      <button id="tPrev" class="tbtn" title="Previous track">⏮</button>
      <button id="tPlay" class="tbtn play" title="Play / Pause">⏵</button>
      <button id="tNext" class="tbtn" title="Next track">⏭</button>
    </div>
    <div class="tgroup vol">
      <button id="tMute" class="tbtn side" title="Mute">🔊</button>
      <input id="tVol" class="volslider" type="range" min="0" max="100" value="100" title="Volume">
    </div>
  </div>

  <div class="footer">
    <span id="count">0 items</span>
    <div class="spacer" style="flex:1"></div>
    <span class="autosave" id="autosave">⟳ <span id="autosaveName"></span></span>
    <span class="scan" id="scan"><span class="spin"></span> reading tags…</span>
  </div>

  <div id="ctx"></div>

  <div class="overlay" id="saveDlg">
    <div class="dialog">
      <div class="dlg-title">Save playlist</div>
      <input id="saveName" type="text" placeholder="Playlist name" spellcheck="false"
        autocomplete="off" autocapitalize="off">
      <div class="dlg-hint" id="saveHint"></div>
      <div class="dlg-buttons">
        <button class="btn" id="saveCancel">Cancel</button>
        <button class="btn primary" id="saveOk">Save</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var iina = window.iina;

  // ---- state ----
  var items = [];            // [{i, path, title, artist, album, duration, isCurrent, isPlaying, isNetwork}]
  var byPath = {};           // path -> item (last one wins; used for meta merge)
  var selection = {};        // real index -> true
  var lastClicked = -1;
  var cursor = -1;           // real index of the keyboard-highlighted row (arrow-key navigation)
  var filter = "";
  var sortKey = "order";
  var sortDir = 1;
  var IS_STANDALONE = false;  // set by the "pl:mode" message
  var hideMainOn = false;     // whether the main player window is hidden
  var transportState = { paused: true, loop: "off", shuffle: false };
  var progress = { pos: 0, dur: 0, paused: true };
  var scrubbing = false;
  var hotkeys = {}; // { playpause, prev, next, seekBack, seekFwd } as mpv key strings

  var $ = function (id) { return document.getElementById(id); };
  function send(name, data) { iina.postMessage(name, data || {}); }

  function fmtDur(sec) {
    sec = Math.round(sec || 0);
    if (!sec) return "";
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var mm = (h && m < 10 ? "0" : "") + m;
    return (h ? h + ":" : "") + mm + ":" + (s < 10 ? "0" : "") + s;
  }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Drag reorder is allowed whenever the list isn't filtered — the displayed order
  // always matches the real playlist order now.
  function reorderable() { return filter === ""; }

  // The view only filters; sorting is applied to the REAL playlist by the backend
  // (so playback order follows it), and items already arrive in playlist order.
  function computeView() {
    if (!filter) return items.slice();
    var f = filter.toLowerCase();
    return items.filter(function (it) {
      return (it.title + " " + it.artist + " " + it.album + " " + it.path).toLowerCase().indexOf(f) >= 0;
    });
  }

  function render() {
    var list = $("list");
    var view = computeView();
    var canDrag = reorderable();
    var html = "";
    for (var k = 0; k < view.length; k++) {
      var it = view[k];
      var cls = "row" + (selection[it.i] ? " selected" : "") + (it.i === cursor ? " cursor" : "")
        + (it.isPlaying || it.isCurrent ? " playing" : "");
      // Line order (top → bottom): artist · album, then the track name.
      // With no tags we skip the top line so the file name isn't shown twice.
      var sub = (it.artist || it.album)
        ? esc([it.artist, it.album].filter(Boolean).join("  ·  "))
        : (it.isNetwork ? "Network stream" : "");
      var status = (it.isPlaying || it.isCurrent) ? "▶" : "";
      html += "<div class='" + cls + "' data-i='" + it.i + "' data-path='" + esc(it.path) + "'"
        + (canDrag ? " draggable='true'" : "") + ">"
        + "<span class='status'>" + status + "</span>"
        + "<span class='idx'>" + (it.i + 1) + "</span>"
        + "<span class='meta'>"
        + (sub ? "<span class='sub' title='" + sub + "'>" + sub + "</span>" : "")
        + "<span class='title' title='" + esc(it.title) + "'>" + esc(it.title) + "</span></span>"
        + "<span class='dur'>" + fmtDur(it.duration) + "</span>"
        + "</div>";
    }
    list.innerHTML = html;
    $("emptyState").style.display = items.length ? "none" : "block";
    $("count").textContent = items.length + (items.length === 1 ? " item" : " items")
      + (filter && view.length !== items.length ? "  (" + view.length + " shown)" : "");
  }

  function baseNoExt(p) {
    var s = String(p).replace(/[\/\\]+$/, "");
    var i = Math.max(s.lastIndexOf("/"), s.lastIndexOf("\\"));
    var b = i >= 0 ? s.slice(i + 1) : s;
    var d = b.lastIndexOf(".");
    return d > 0 ? b.slice(0, d) : b;
  }

  // ---- selection ----
  function clearSel() { selection = {}; }
  function selectedIndexes() { return Object.keys(selection).map(Number).sort(function (a, b) { return a - b; }); }

  // Apply the current selection to the EXISTING DOM rows without rebuilding them.
  // Rebuilding innerHTML on mousedown would destroy the node between the two clicks
  // of a double-click, so we only toggle classes here.
  function applySelection() {
    var rows = document.querySelectorAll("#list .row");
    for (var k = 0; k < rows.length; k++) {
      var idx = parseInt(rows[k].getAttribute("data-i"), 10);
      rows[k].classList.toggle("selected", !!selection[idx]);
    }
  }

  // ---- keyboard cursor (arrow-key navigation over the current view) ----
  function viewPosOfCursor(view) {
    if (cursor < 0) return -1;
    for (var k = 0; k < view.length; k++) if (view[k].i === cursor) return k;
    return -1;
  }
  // The index the Enter/Shift+Enter/Opt+Shift+Enter actions operate on: the
  // keyboard cursor if set, otherwise the first selected row, otherwise the top row.
  function activeIndex() {
    var view = computeView();
    var pos = viewPosOfCursor(view);
    if (pos >= 0) return view[pos].i;
    var sel = selectedIndexes();
    if (sel.length) return sel[0];
    return view.length ? view[0].i : -1;
  }
  function scrollCursorIntoView() {
    var row = document.querySelector("#list .row.cursor");
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
  }
  // Move the highlight by `delta` rows within the filtered view; the selection
  // follows the cursor so a single row stays highlighted for the actions below.
  function moveCursor(delta) {
    var view = computeView();
    if (!view.length) { cursor = -1; return; }
    var pos = viewPosOfCursor(view);
    if (pos < 0) pos = delta > 0 ? 0 : view.length - 1;
    else pos = Math.max(0, Math.min(view.length - 1, pos + delta));
    cursor = view[pos].i;
    clearSel(); selection[cursor] = true; lastClicked = cursor;
    render();
    scrollCursorIntoView();
  }
  // Run one of the three actions on the active row.
  //   play       → start playing it now
  //   queue-next → move it to right after the current track
  //   copy-next  → insert a copy right after the current track (original stays)
  function activateCursor(mode) {
    var i = activeIndex();
    if (i < 0) return;
    if (mode === "queue-next") send("ui:queue-next", { index: i });
    else if (mode === "copy-next") send("ui:copy-next", { index: i });
    else send("ui:play", { index: i });
  }
  // Handle the shared navigation keys (Up/Down/Enter). Returns true if consumed.
  function handleNavKey(e) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); return true; }
    if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); return true; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (e.shiftKey && e.altKey) activateCursor("copy-next");
      else if (e.shiftKey) activateCursor("queue-next");
      else activateCursor("play");
      return true;
    }
    return false;
  }

  // Scroll the list to the currently playing track and highlight it. If a search
  // filter is hiding it, the filter is cleared first so the track is revealed.
  function scrollToCurrent() {
    var cur = -1;
    for (var k = 0; k < items.length; k++) {
      if (items[k].isPlaying || items[k].isCurrent) { cur = items[k].i; break; }
    }
    if (cur < 0) return; // nothing playing
    if (filter && viewPosOfCursorFor(cur) < 0) { filter = ""; $("search").value = ""; }
    cursor = cur; clearSel(); selection[cur] = true; lastClicked = cur;
    render();
    var row = document.querySelector("#list .row[data-i='" + cur + "']");
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  // Is the given real index present in the current filtered view?
  function viewPosOfCursorFor(i) {
    var view = computeView();
    for (var k = 0; k < view.length; k++) if (view[k].i === i) return k;
    return -1;
  }

  var lastTapTime = 0, lastTapIndex = -1;
  function onRowMouseDown(e) {
    if (e.button !== 0) return; // left button only; right-click is handled by contextmenu
    var row = e.target.closest(".row"); if (!row) return;
    var i = parseInt(row.getAttribute("data-i"), 10);

    // Manual double-click detection — robust against DOM refreshes and draggable rows.
    var now = Date.now();
    if (i === lastTapIndex && (now - lastTapTime) < 450) {
      lastTapTime = 0; lastTapIndex = -1;
      send("ui:play", { index: i });
      return;
    }
    lastTapTime = now; lastTapIndex = i;

    if (e.metaKey || e.ctrlKey) {
      if (selection[i]) delete selection[i]; else selection[i] = true;
    } else if (e.shiftKey && lastClicked >= 0) {
      var view = computeView().map(function (x) { return x.i; });
      var a = view.indexOf(lastClicked), b = view.indexOf(i);
      if (a >= 0 && b >= 0) {
        clearSel();
        for (var j = Math.min(a, b); j <= Math.max(a, b); j++) selection[view[j]] = true;
      }
    } else {
      clearSel(); selection[i] = true;
    }
    lastClicked = i;
    cursor = i; // keyboard navigation continues from the row just clicked
    applySelection();
  }

  // ---- drag reorder ----
  var dragFrom = -1;
  function onDragStart(e) {
    var row = e.target.closest(".row"); if (!row) return;
    dragFrom = parseInt(row.getAttribute("data-i"), 10);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", String(dragFrom)); } catch (x) {}
  }
  function onDragOver(e) {
    if (dragFrom < 0) return;
    e.preventDefault();
    var row = e.target.closest(".row"); if (!row) return;
    clearDragMarks();
    var r = row.getBoundingClientRect();
    row.classList.add((e.clientY - r.top) < r.height / 2 ? "dragover-top" : "dragover-bottom");
  }
  function clearDragMarks() {
    var m = document.querySelectorAll(".dragover-top,.dragover-bottom");
    for (var i = 0; i < m.length; i++) { m[i].classList.remove("dragover-top"); m[i].classList.remove("dragover-bottom"); }
  }
  function onDrop(e) {
    if (dragFrom < 0) return;
    e.preventDefault();
    var row = e.target.closest(".row"); clearDragMarks();
    if (!row) { dragFrom = -1; return; }
    var to = parseInt(row.getAttribute("data-i"), 10);
    var r = row.getBoundingClientRect();
    var after = (e.clientY - r.top) >= r.height / 2;
    var gap = to + (after ? 1 : 0); // insert-before index; backend converts to a move
    send("ui:move", { from: dragFrom, to: gap });
    dragFrom = -1;
  }

  // ---- context menu ----
  function showCtx(e) {
    var row = e.target.closest(".row"); if (!row) return;
    e.preventDefault();
    var i = parseInt(row.getAttribute("data-i"), 10);
    if (!selection[i]) { clearSel(); selection[i] = true; lastClicked = i; applySelection(); }
    var path = row.getAttribute("data-path");
    var n = selectedIndexes().length;
    var ctx = $("ctx");
    ctx.innerHTML =
      "<div class='mi' data-act='play'>Play</div>" +
      "<div class='mi' data-act='reveal'>Reveal in Finder</div>" +
      "<div class='sep'></div>" +
      "<div class='mi' data-act='remove'>Remove" + (n > 1 ? " " + n + " items" : "") + "</div>";
    ctx.style.display = "block";
    var vw = window.innerWidth, vh = window.innerHeight;
    var x = Math.min(e.clientX, vw - ctx.offsetWidth - 6);
    var y = Math.min(e.clientY, vh - ctx.offsetHeight - 6);
    ctx.style.left = x + "px"; ctx.style.top = y + "px";
    ctx.onclick = function (ev) {
      var mi = ev.target.closest(".mi"); if (!mi) return;
      var act = mi.getAttribute("data-act");
      if (act === "play") send("ui:play", { index: i });
      else if (act === "reveal") send("ui:reveal", { path: path });
      else if (act === "remove") send("ui:remove", { indexes: selectedIndexes() });
      hideCtx();
    };
  }
  function hideCtx() { $("ctx").style.display = "none"; }

  // ---- saved playlists menu ----
  var savedNames = [];
  var activeName = "";   // saved playlist the current list belongs to ("" = none yet)
  function renderSavedMenu() {
    var menu = $("loadMenu");
    var html = "";
    if (savedNames.length === 0) {
      html += "<div class='empty'>No saved playlists</div>";
    } else {
      for (var i = 0; i < savedNames.length; i++) {
        var nm = savedNames[i];
        html += "<div class='mi' data-name='" + esc(nm) + "'>"
          + "<span class='name'>" + esc(nm) + "</span>"
          + "<span class='del' data-del='" + esc(nm) + "' title='Delete'>✕</span></div>";
      }
    }
    html += "<div class='sep'></div><div class='mi' data-import='1'>Import file…</div>";
    menu.innerHTML = html;
  }
  function toggleLoadMenu(open) {
    var menu = $("loadMenu");
    if (open == null) open = !menu.classList.contains("open");
    menu.classList.toggle("open", open);
  }

  // ---- save dialog (doubles as "Save As") ----
  // The name field starts on the active playlist: keep it to update that playlist,
  // change it to store the current list under a new name.
  function saveDialogOpen() { return $("saveDlg").classList.contains("open"); }
  function openSaveDialog() {
    var input = $("saveName");
    input.value = activeName;
    $("saveDlg").classList.add("open");
    updateSaveHint();
    input.focus();
    input.select();
  }
  function closeSaveDialog() { $("saveDlg").classList.remove("open"); }
  function confirmSaveDialog() {
    var name = $("saveName").value.trim();
    if (!name) return;
    send("ui:save", { name: name });
    closeSaveDialog();
  }
  // Spell out what pressing Save will do, so overwriting is never a surprise.
  function updateSaveHint() {
    var name = $("saveName").value.trim();
    var hint;
    if (!name) hint = "Enter a playlist name.";
    else if (name === activeName) hint = "Updates the current playlist.";
    else if (savedNames.indexOf(name) >= 0) hint = "Overwrites the saved playlist “" + name + "”.";
    else hint = "Creates a new playlist.";
    $("saveHint").textContent = hint;
    $("saveOk").disabled = !name;
  }

  // ---- YouTube Music search panel ----
  // The backend searches (ytmusic.js) and replies with "pl:ytm-results"; the panel
  // stays open after adding, so several songs can be picked in a row.
  var YTM_HINT = "Type a song, artist or album and press ↩.";
  var ytmResults = [];      // [{url, title, artist, album, duration, thumbnail}]
  var ytmCursor = -1;       // index of the highlighted result
  var ytmLastQuery = "";    // query the shown results belong to ("" = none / failed)
  var ytmRequestId = 0;     // id of the newest search; replies to older ones are ignored
  var ytmAdded = {};        // url -> true once added (shown as ✓ on the row)

  function isYtmOpen() { return document.body.classList.contains("ytm-open"); }
  function openYtm() {
    hideCtx(); toggleLoadMenu(false);
    document.body.classList.add("ytm-open");
    if (!ytmLastQuery && !ytmResults.length) setYtmStatus(YTM_HINT, false);
    $("ytmQuery").focus();
    $("ytmQuery").select();
  }
  function closeYtm() { document.body.classList.remove("ytm-open"); $("ytmQuery").blur(); }

  function setYtmStatus(text, busy) {
    $("ytmStatus").innerHTML = (busy ? "<span class='spin'></span>" : "") + "<span>" + esc(text) + "</span>";
  }

  function startYtmSearch(query) {
    ytmRequestId++;
    ytmLastQuery = query;
    ytmResults = []; ytmCursor = -1;
    renderYtmResults();
    setYtmStatus("Searching YouTube Music…", true);
    send("ui:ytm-search", { query: query, requestId: ytmRequestId });
  }

  function ytmStatusText(reply) {
    if (reply.error) return reply.error;
    if (!ytmResults.length) return "Nothing found.";
    var text = ytmResults.length + (ytmResults.length === 1 ? " song" : " songs") + " · ↩ add · ⇧↩ play next";
    return reply.titlesOnly ? text + " · titles only for now (artist fills in after adding)" : text;
  }

  function ytmRowHtml(track, k) {
    var sub = esc([track.artist, track.album].filter(Boolean).join("  ·  "));
    var added = !!ytmAdded[track.url];
    var thumb = track.thumbnail
      ? "<img class='ytm-thumb' src='" + esc(track.thumbnail) + "' alt=''>"
      : "<span class='ytm-thumb'></span>";
    return "<div class='row ytm-row" + (k === ytmCursor ? " cursor" : "") + "' data-k='" + k + "'>"
      + thumb
      + "<span class='meta'>"
      + (sub ? "<span class='sub' title='" + sub + "'>" + sub + "</span>" : "")
      + "<span class='title' title='" + esc(track.title) + "'>" + esc(track.title) + "</span></span>"
      + "<span class='dur'>" + fmtDur(track.duration) + "</span>"
      + "<span class='ytm-actions'>"
      + "<button class='btn' data-act='next' title='Play next (⇧↩)'>Next</button>"
      + "<button class='btn icon" + (added ? " added" : "") + "' data-act='add' title='Add to the end of the playlist (↩)'>"
      + (added ? "✓" : "＋") + "</button>"
      + "</span></div>";
  }

  function renderYtmResults() {
    var html = "";
    for (var k = 0; k < ytmResults.length; k++) html += ytmRowHtml(ytmResults[k], k);
    $("ytmResults").innerHTML = html;
    $("ytmAddAll").disabled = !ytmResults.length;
  }

  // Move the highlight by toggling classes only — rebuilding the rows between the
  // two clicks of a double-click would swallow the dblclick event.
  function setYtmCursor(k) {
    ytmCursor = k;
    var rows = document.querySelectorAll("#ytmResults .ytm-row");
    for (var j = 0; j < rows.length; j++) rows[j].classList.toggle("cursor", j === k);
    if (rows[k] && rows[k].scrollIntoView) rows[k].scrollIntoView({ block: "nearest" });
  }
  function moveYtmCursor(delta) {
    if (!ytmResults.length) return;
    var k = ytmCursor < 0 ? 0 : Math.max(0, Math.min(ytmResults.length - 1, ytmCursor + delta));
    setYtmCursor(k);
  }

  function addYtmResults(indexes, playNext) {
    var tracks = indexes.map(function (k) { return ytmResults[k]; }).filter(Boolean);
    if (!tracks.length) return;
    send("ui:ytm-add", { tracks: tracks, playNext: !!playNext });
    tracks.forEach(function (t) { ytmAdded[t.url] = true; });
    renderYtmResults();
  }
  function addAllYtmResults() {
    addYtmResults(ytmResults.map(function (t, k) { return k; }), false);
  }

  // Enter searches when the query was edited; otherwise it adds the highlighted
  // result (Shift+Enter: play it next).
  function onYtmEnter(fromQueryField, playNext) {
    var query = $("ytmQuery").value.trim();
    if (fromQueryField && query && query !== ytmLastQuery) { startYtmSearch(query); return; }
    if (ytmCursor >= 0) addYtmResults([ytmCursor], playNext);
  }

  // Keyboard while the panel is open. Keys it doesn't use still reach the
  // playback hotkeys, unless the user is typing in the query field.
  function handleYtmKey(e) {
    var inQuery = e.target === $("ytmQuery");
    if (e.key === "Escape") { e.preventDefault(); closeYtm(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); moveYtmCursor(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveYtmCursor(-1); }
    else if (e.key === "Enter") { e.preventDefault(); onYtmEnter(inQuery, e.shiftKey); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("ytmQuery").focus(); }
    else if (!inQuery) handlePlaybackHotkey(e);
  }

  // ---- incoming messages ----
  iina.onMessage("pl:state", function (data) {
    items = (data && data.items) || [];
    byPath = {};
    var valid = {};
    items.forEach(function (it) { byPath[it.path] = it; valid[it.i] = true; });
    Object.keys(selection).forEach(function (k) { if (!valid[k]) delete selection[k]; });
    if (cursor >= 0 && !valid[cursor]) cursor = -1;
    render();
    toggleScan(data && data.scanning);
  });

  iina.onMessage("pl:meta", function (m) {
    if (!m) return;
    var changed = false;
    items.forEach(function (it) {
      if (it.path === m.path) {
        if (m.title) it.title = m.title;
        it.artist = m.artist || it.artist;
        it.album = m.album || it.album;
        if (m.duration) it.duration = m.duration;
        changed = true;
      }
    });
    if (changed) render();
  });

  iina.onMessage("pl:saved", function (d) { savedNames = (d && d.names) || []; renderSavedMenu(); });
  // The saved playlist the current list belongs to, plus whether changes to it
  // are being auto-saved (shown in the footer).
  iina.onMessage("pl:active", function (d) {
    activeName = (d && d.name) || "";
    var on = !!(d && d.autoSave && activeName);
    $("autosave").classList.toggle("on", on);
    if (on) {
      $("autosaveName").textContent = activeName;
      $("autosave").title = "Changes are auto-saved to the playlist “" + activeName + "”";
    }
  });
  iina.onMessage("pl:scan", function (d) { toggleScan(d && d.active); });
  iina.onMessage("pl:mode", function (d) {
    IS_STANDALONE = !!(d && d.standalone);
    hideMainOn = !!(d && d.hideMain);
    // The pop-out button is redundant in the window; the "hide player" toggle only makes
    // sense there (in the sidebar it would hide its own host window).
    $("popout").style.display = IS_STANDALONE ? "none" : "";
    var hm = $("hidemain");
    hm.style.display = IS_STANDALONE ? "" : "none";
    hm.classList.toggle("active", hideMainOn);
  });

  iina.onMessage("pl:transport", function (t) { if (t) { transportState = t; renderTransport(); } });
  iina.onMessage("pl:progress", function (p) { if (p) { progress = p; if (!scrubbing) renderProgress(); } });
  iina.onMessage("pl:hotkeys", function (h) { hotkeys = h || {}; });
  iina.onMessage("pl:ytm-results", function (reply) {
    if (!reply || reply.requestId !== ytmRequestId) return; // answer to a replaced query
    ytmResults = reply.tracks || [];
    ytmCursor = ytmResults.length ? 0 : -1;
    if (reply.error) ytmLastQuery = ""; // let Enter retry the same query
    setYtmStatus(ytmStatusText(reply), false);
    renderYtmResults();
  });

  // Build the same mpv-style key string the preferences recorder stores, so we can match.
  var HK_SPECIAL = {
    " ": "SPACE", "ArrowLeft": "LEFT", "ArrowRight": "RIGHT", "ArrowUp": "UP", "ArrowDown": "DOWN",
    "Enter": "ENTER", "Backspace": "BS", "Tab": "TAB", "Delete": "DEL",
    "Home": "HOME", "End": "END", "PageUp": "PGUP", "PageDown": "PGDWN"
  };
  function eventToMpvKey(e) {
    var k = e.key;
    if (k === "Shift" || k === "Control" || k === "Alt" || k === "Meta") return null;
    var base;
    if (HK_SPECIAL[k]) base = HK_SPECIAL[k];
    else if (k.length === 1) base = k;
    else if (/^F\d{1,2}$/.test(k)) base = k.toUpperCase();
    else return null;
    var mods = "";
    if (e.ctrlKey) mods += "Ctrl+";
    if (e.altKey) mods += "Alt+";
    if (e.shiftKey && k.length !== 1) mods += "Shift+";
    if (e.metaKey) mods += "Meta+";
    return mods + base;
  }

  function toggleScan(on) { $("scan").classList.toggle("on", !!on); }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var mm = (h && m < 10 ? "0" : "") + m;
    return (h ? h + ":" : "") + mm + ":" + (s < 10 ? "0" : "") + s;
  }
  function setBar(frac, cur) {
    $("pfill").style.width = (Math.max(0, Math.min(1, frac)) * 100) + "%";
    $("pCur").textContent = fmtTime(cur);
  }
  function renderProgress() {
    var dur = progress.dur || 0, pos = progress.pos || 0;
    setBar(dur > 0 ? pos / dur : 0, pos);
    $("pDur").textContent = fmtTime(dur);
  }

  function renderTransport() {
    var t = transportState;
    var play = $("tPlay");
    play.textContent = t.paused ? "⏵" : "⏸";
    play.title = t.paused ? "Play" : "Pause";
    var rep = $("tRepeat");
    rep.textContent = t.loop === "one" ? "🔂" : "🔁";
    rep.classList.toggle("active", t.loop !== "off");
    rep.title = "Repeat: " + (t.loop === "all" ? "whole playlist" : t.loop === "one" ? "one track" : "off");
    $("tShuffle").classList.toggle("active", !!t.shuffle);
    renderVolume(t);
  }
  function renderVolume(t) {
    var vol = typeof t.volume === "number" ? t.volume : 100;
    var muted = !!t.muted;
    var slider = $("tVol");
    // Don't fight the user while they're dragging the slider.
    if (document.activeElement !== slider) slider.value = muted ? 0 : vol;
    var shown = muted ? 0 : Number(slider.value);
    slider.style.background = "linear-gradient(to right, var(--accent) 0%, var(--accent) " +
      shown + "%, var(--field-bg) " + shown + "%)";
    var mute = $("tMute");
    mute.textContent = (muted || vol === 0) ? "🔇" : vol < 50 ? "🔉" : "🔊";
    mute.classList.toggle("active", muted);
    mute.title = muted ? "Unmute" : "Mute";
  }

  // ---- wire up ----
  var list = $("list");
  list.addEventListener("mousedown", onRowMouseDown); // selection + manual double-click → play
  list.addEventListener("dragstart", onDragStart);
  list.addEventListener("dragover", onDragOver);
  list.addEventListener("dragleave", clearDragMarks);
  list.addEventListener("drop", onDrop);
  list.addEventListener("contextmenu", showCtx);

  document.addEventListener("mousedown", function (e) {
    if (!e.target.closest("#ctx")) hideCtx();
    if (!e.target.closest(".dropdown")) toggleLoadMenu(false);
  });
  window.addEventListener("blur", function () { hideCtx(); toggleLoadMenu(false); });

  $("search").addEventListener("input", function (e) {
    filter = e.target.value || "";
    // While filtering, pre-highlight the top match so Enter plays it immediately
    // and Up/Down step through the results without touching the mouse.
    if (filter) {
      var view = computeView();
      cursor = view.length ? view[0].i : -1;
      clearSel(); if (cursor >= 0) { selection[cursor] = true; lastClicked = cursor; }
    } else {
      cursor = -1;
    }
    render();
  });
  $("sort").addEventListener("change", function (e) {
    sortKey = e.target.value;
    send("ui:sort", { key: sortKey, dir: sortDir }); // physically reorders the playlist
  });
  $("sortdir").addEventListener("click", function () {
    sortDir = -sortDir;
    $("sortdir").textContent = sortDir === 1 ? "↑" : "↓";
    send("ui:sort", { key: sortKey, dir: sortDir });
  });

  $("add").addEventListener("click", function () { send("ui:add"); });
  $("addfolder").addEventListener("click", function () { send("ui:addfolder"); });
  $("addurl").addEventListener("click", function () { send("ui:addurl"); });
  $("ytmOpen").addEventListener("click", openYtm);
  $("ytmClose").addEventListener("click", closeYtm);
  $("ytmAddAll").addEventListener("click", addAllYtmResults);
  $("ytmResults").addEventListener("click", function (e) {
    var row = e.target.closest(".ytm-row"); if (!row) return;
    var k = parseInt(row.getAttribute("data-k"), 10);
    var button = e.target.closest("[data-act]");
    setYtmCursor(k);
    if (button) addYtmResults([k], button.getAttribute("data-act") === "next");
  });
  $("ytmResults").addEventListener("dblclick", function (e) {
    var row = e.target.closest(".ytm-row");
    if (!row || e.target.closest("[data-act]")) return; // the buttons handle their own clicks
    addYtmResults([parseInt(row.getAttribute("data-k"), 10)], false);
  });
  $("save").addEventListener("click", openSaveDialog);
  $("saveName").addEventListener("input", updateSaveHint);
  $("saveOk").addEventListener("click", confirmSaveDialog);
  $("saveCancel").addEventListener("click", closeSaveDialog);
  $("saveDlg").addEventListener("mousedown", function (e) { if (e.target === $("saveDlg")) closeSaveDialog(); });
  $("clear").addEventListener("click", function () { send("ui:clear"); });
  $("refresh").addEventListener("click", function () { send("ui:refresh"); });
  $("locate").addEventListener("click", scrollToCurrent);
  $("popout").addEventListener("click", function () { send("ui:popout"); });
  $("hidemain").addEventListener("click", function () {
    hideMainOn = !hideMainOn;
    $("hidemain").classList.toggle("active", hideMainOn);
    send("ui:hidemain", { hidden: hideMainOn });
  });

  // Transport controls
  $("tPrev").addEventListener("click", function () { send("ui:prev-smart"); });
  $("tNext").addEventListener("click", function () { send("ui:playNext"); });
  $("tPlay").addEventListener("click", function () {
    transportState.paused = !transportState.paused; renderTransport(); // optimistic
    send("ui:playpause");
  });
  $("tRepeat").addEventListener("click", function () { send("ui:cycle-repeat"); });
  $("tShuffle").addEventListener("click", function () { send("ui:toggle-shuffle"); });
  $("tMute").addEventListener("click", function () { send("ui:mute"); });
  $("tVol").addEventListener("input", function () {
    var v = Number($("tVol").value);
    transportState.volume = v; transportState.muted = false;
    renderVolume(transportState);              // instant local feedback
    send("ui:volume", { value: v });
  });
  renderTransport();

  // Progress bar: click / drag to seek
  var pbar = $("pbar");
  function fracFromEvent(e) {
    var r = pbar.getBoundingClientRect();
    return r.width > 0 ? Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) : 0;
  }
  pbar.addEventListener("mousedown", function (e) {
    if (!(progress.dur > 0)) return;
    scrubbing = true; pbar.classList.add("scrubbing");
    var f = fracFromEvent(e); setBar(f, f * progress.dur);
    e.preventDefault();
  });
  document.addEventListener("mousemove", function (e) {
    if (!scrubbing) return;
    var f = fracFromEvent(e); setBar(f, f * progress.dur);
  });
  document.addEventListener("mouseup", function (e) {
    if (!scrubbing) return;
    scrubbing = false; pbar.classList.remove("scrubbing");
    var f = fracFromEvent(e), pos = f * (progress.dur || 0);
    progress.pos = pos; renderProgress();
    send("ui:seek", { pos: pos });
  });
  renderProgress();

  // Report the window's content size so the plugin can restore it next time.
  var rzTimer = null;
  window.addEventListener("resize", function () {
    if (!IS_STANDALONE) return;
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function () {
      send("ui:winsize", { w: window.innerWidth, h: window.innerHeight });
    }, 250);
  });

  $("loadBtn").addEventListener("click", function () { toggleLoadMenu(); });
  $("loadMenu").addEventListener("click", function (e) {
    var del = e.target.closest(".del");
    if (del) { e.stopPropagation(); send("ui:delete-saved", { name: del.getAttribute("data-del") }); return; }
    var imp = e.target.closest("[data-import]");
    if (imp) { send("ui:import"); toggleLoadMenu(false); return; }
    var mi = e.target.closest(".mi[data-name]");
    if (mi) { send("ui:load", { name: mi.getAttribute("data-name") }); toggleLoadMenu(false); }
  });

  // Configurable playback hotkeys (also handled in the main window via iina.input).
  // Returns true if the key was one of them.
  function handlePlaybackHotkey(e) {
    var mk = eventToMpvKey(e);
    if (!mk) return false;
    if (mk === hotkeys.playpause) { transportState.paused = !transportState.paused; renderTransport(); send("ui:playpause"); }
    else if (mk === hotkeys.prev) send("ui:prev-smart");
    else if (mk === hotkeys.next) send("ui:playNext");
    else if (mk === hotkeys.seekBack) send("ui:seek-rel", { delta: -10 });
    else if (mk === hotkeys.seekFwd) send("ui:seek-rel", { delta: 10 });
    else return false;
    e.preventDefault();
    return true;
  }

  document.addEventListener("keydown", function (e) {
    // The save dialog owns the keyboard while it is open.
    if (saveDialogOpen()) {
      if (e.key === "Escape") { e.preventDefault(); closeSaveDialog(); }
      else if (e.key === "Enter") { e.preventDefault(); confirmSaveDialog(); }
      return;
    }
    // So does the YouTube Music panel — the (hidden) playlist must not react.
    if (isYtmOpen()) { handleYtmKey(e); return; }
    if (e.target.tagName === "INPUT") {
      if (e.key === "Escape") { e.target.value = ""; filter = ""; cursor = -1; render(); e.target.blur(); return; }
      // Arrow keys pick a result and Enter/Shift+Enter/Opt+Shift+Enter act on it,
      // all without leaving the search field.
      if (handleNavKey(e)) return;
      return;
    }
    // Leave native keyboard behaviour to real form controls (e.g. the sort dropdown).
    if (e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
    if (handlePlaybackHotkey(e)) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("search").focus(); return; }
    // Up/Down move the highlight; Enter plays, Shift+Enter queues next, Opt+Shift+Enter copies next.
    if (handleNavKey(e)) return;
    if (e.key === "Backspace" || e.key === "Delete") {
      var sel = selectedIndexes(); if (sel.length) { e.preventDefault(); send("ui:remove", { indexes: sel }); }
    } else if (e.key === "a" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault(); computeView().forEach(function (it) { selection[it.i] = true; }); render();
    }
  });

  // ---- go ----
  renderSavedMenu();
  send("ui:ready");
})();
</script>
</body>
</html>
